[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gs2txt"
version = "0.1.0"
description = "LLM-powered biological process annotation for gene sets"
readme = "readme.md"
license = {text = "MIT"}
authors = [
    {name = "Yushuai Wu", email = "80359555@qq.com"}
]
maintainers = [
    {name = "Yushuai Wu", email = "80359555@qq.com"}
]
keywords = [
    "bioinformatics",
    "genomics",
    "gene-set-analysis",
    "llm",
    "annotation",
    "functional-genomics"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
enrichment = [
    "gseapy>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "gseapy>=1.0.0",
]
all = [
    "gseapy>=1.0.0",
]

[project.scripts]
gs2txt = "gs2txt.cli:main"

[project.urls]
Homepage = "https://github.com/wuys13/gs2txt"
Repository = "https://github.com/wuys13/gs2txt"
Issues = "https://github.com/wuys13/gs2txt/issues"
Documentation = "https://github.com/wuys13/gs2txt#readme"

[tool.setuptools]
packages = ["gs2txt"]

[tool.setuptools.package-data]
gs2txt = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=gs2txt --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["gs2txt"]
omit = [
    "*/tests/*",
    "*/examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "gseapy.*",
    "openai.*",
    "anthropic.*",
]
ignore_missing_imports = true
